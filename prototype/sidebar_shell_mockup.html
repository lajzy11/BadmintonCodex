<h2 class="sr-only">桌機側邊欄提案：左側分為系統、球團切換、球團設定三區，右側為活動內容與三個頁籤</h2>
<div style="display:flex;gap:0;border:0.5px solid var(--border);border-radius:12px;overflow:hidden;min-height:380px">

    </div>
    <div style="padding:12px 16px;flex:1">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:var(--radius);background:var(--surface-2);border:0.5px solid var(--border);margin-bottom:10px">

        <i class="ti ti-chevron-down" style="font-size:14px;color:var(--text-secondary)" aria-hidden="true"></i>
      </div>

        <div style="padding:7px 8px;border-radius:var(--radius);background:var(--bg-accent-muted,var(--surface-2));font-size:13px;color:var(--text-accent)">8/29（五）進行中</div>
        <div style="padding:7px 8px;border-radius:var(--radius);font-size:13px;color:var(--text-secondary)">9/3（三）即將開始</div>
        <div style="padding:7px 8px;border-radius:var(--radius);font-size:13px;color:var(--text-secondary)">8/22（五）已結束</div>

    </div>
    <div style="border-top:0.5px solid var(--border);padding:8px">
      <div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius);font-size:13px;color:var(--text-secondary)"><i class="ti ti-settings" style="font-size:16px" aria-hidden="true"></i>系統設定</div>
      <div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius);font-size:13px;color:var(--text-secondary)"><i class="ti ti-user" style="font-size:16px" aria-hidden="true"></i>帳號設定</div>

  <div style="flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;gap:20px;border-bottom:0.5px solid var(--border);padding-bottom:10px">

      <span style="font-size:13px;color:var(--text-secondary)">排點作業</span>
    </div>
    <div style="font-size:12px;color:var(--text-muted)">活動內容區（依所選頁籤切換）</div>
